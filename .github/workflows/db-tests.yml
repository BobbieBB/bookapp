name: Tests

on:
  push:
  pull_request:

jobs:
  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Run spoiler rule tests
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
        run: supabase/tests/run.sh

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - run: npm ci
      - run: npm run lint
      - name: Start local Supabase
        run: |
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector
          supabase status -o env | sed -n 's/^API_URL="\(.*\)"$/EXPO_PUBLIC_SUPABASE_URL=\1/p; s/^PUBLISHABLE_KEY="\(.*\)"$/EXPO_PUBLIC_SUPABASE_KEY=\1/p; s/^SECRET_KEY="\(.*\)"$/SUPABASE_SECRET_KEY=\1/p' >> "$GITHUB_ENV"
      - run: npm run typecheck
      - run: npm test
