name: Tests

on:
  push:
  pull_request:

jobs:
  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Run spoiler rule tests
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
        run: supabase/tests/run.sh

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Our own test stack (tools/teststack), the one local runs use, on slot 0. The images come
      # from public.ecr.aws, whose anonymous pulls are rate limited: retried with a backoff.
      - name: Pull the test stack images
        run: |
          for attempt in 1 2 3 4 5; do
            SLOT=0 docker compose -f tools/teststack/docker-compose.yml pull --quiet && exit 0
            echo "pull failed (attempt $attempt), retrying"; sleep $((attempt * 15))
          done
          exit 1
      - name: Start the test stack
        run: |
          tools/teststack/up.sh 0
          tools/teststack/env.sh 0 | sed 's/^export //' >> "$GITHUB_ENV"
      - run: npm run typecheck
      - run: npm test
      - name: Test stack logs
        if: failure()
        run: SLOT=0 docker compose -f tools/teststack/docker-compose.yml logs --tail 200
