# Temporary: does Livami build for the web (an iPhone stopgap until Apple approves the developer account)?
name: web-spike
on:
  push:
    branches: [spike/web]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Export for the web
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_KEY: sb_publishable_spike
          CI: 1
        run: npx expo export -p web --output-dir web-dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-dist
          path: web-dist
