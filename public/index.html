<!doctype html>
<!-- Livami's web version: the iPhone stopgap until Apple approves the developer account (PO, 27 Nov 2026).
     iPhone readers open it in Safari and add it to the Home Screen. Used only by the web build. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Livami</title>
    <!-- Behind a login, and kept out of search engines, as we promise authors. -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- "Add to Home Screen": opens full screen with Livami's name and icon. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Livami" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#F6F8F7" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      html, body, #root { width: 100%; height: 100%; }
      body { margin: 0; overflow: hidden; background: #F6F8F7; }
      #root { display: flex; }
    </style>
  </head>
  <body>
    <noscript>Livami needs JavaScript.</noscript>
    <div id="root"></div>
  </body>
</html>
