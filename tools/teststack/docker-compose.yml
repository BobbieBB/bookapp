# A self-contained Supabase stack for the app tests: the services `supabase start` runs for them,
# from the same pinned images as Supabase CLI 2.121.0, configured as the CLI configures them from
# supabase/config.toml. Many copies run side by side, one per SLOT (0-9):
#
#   compose project  livami-test-<slot>
#   API (Kong)       127.0.0.1:55<slot>21
#   Postgres         127.0.0.1:55<slot>22
#   Mailpit          127.0.0.1:55<slot>24
#
# Drive it with the scripts next to this file (up.sh, reset.sh, env.sh, down.sh), not by hand.
# Every key and secret here is a fixed, test-only value (the CLI's own local defaults where it has
# them); nothing here is used outside a local or CI test run.

name: livami-test-${SLOT:?set SLOT to 0-9}

x-jwt-secret: &jwt-secret super-secret-jwt-token-with-at-least-32-characters-long
# The public half of GOTRUE_JWT_KEYS plus the HS256 secret (base64url of the secret above).
x-jwks: &jwks '{"keys":[{"kty":"EC","kid":"6c1b6c3e-7d43-4f6b-9a63-1d2b4f0e5a10","use":"sig","key_ops":["verify"],"alg":"ES256","ext":true,"crv":"P-256","x":"u_Nfbk_wYeaZNMYdeUrjNOv_EefXqh4AmwwUvkqfslA","y":"m7BIT4X0a0qzcrxsQrJMzM8JoaBxDfmwByOw1pMn_pI"},{"kty":"oct","k":"c3VwZXItc2VjcmV0LWp3dC10b2tlbi13aXRoLWF0LWxlYXN0LTMyLWNoYXJhY3RlcnMtbG9uZw"}]}'
x-anon-key: &anon-key eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
x-service-key: &service-key eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
x-api-url: &api-url http://127.0.0.1:55${SLOT}21

services:
  db:
    image: public.ecr.aws/supabase/postgres:17.11.0.004
    entrypoint: ["sh", "-c"]
    # The image's migrate.sh runs /etc/postgresql.schema.sql once, at init; the CLI writes it the same
    # way. fsync and friends are off: a throwaway test database never needs crash safety.
    command:
      - |
        cp /teststack/db/schema.sql /etc/postgresql.schema.sql &&
        exec docker-entrypoint.sh postgres -D /etc/postgresql -c fsync=off -c synchronous_commit=off -c full_page_writes=off
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: /var/run/postgresql
      JWT_SECRET: *jwt-secret
      JWT_EXP: "3600"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db:/teststack/db:ro
    ports:
      - 127.0.0.1:55${SLOT}22:5432
    healthcheck:
      test: pg_isready -U postgres -h 127.0.0.1 -p 5432
      interval: 1s
      timeout: 2s
      retries: 120

  auth:
    image: public.ecr.aws/supabase/gotrue:v2.197.0
    depends_on:
      db: { condition: service_healthy }
    environment:
      API_EXTERNAL_URL: http://127.0.0.1:55${SLOT}21/auth/v1
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgresql://supabase_auth_admin:postgres@db:5432/postgres
      GOTRUE_DB_MAX_POOL_SIZE: "10"
      GOTRUE_DB_MAX_IDLE_POOL_SIZE: "10"
      GOTRUE_SITE_URL: http://127.0.0.1:3000
      GOTRUE_URI_ALLOW_LIST: https://127.0.0.1:3000
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_SECRET: *jwt-secret
      GOTRUE_JWT_ISSUER: http://127.0.0.1:55${SLOT}21/auth/v1
      GOTRUE_JWT_VALID_METHODS: HS256,RS256,ES256
      GOTRUE_JWT_VALIDMETHODS: HS256,RS256,ES256
      GOTRUE_JWT_KEYS: '[{"kty":"EC","kid":"6c1b6c3e-7d43-4f6b-9a63-1d2b4f0e5a10","use":"sig","key_ops":["sign","verify"],"alg":"ES256","ext":true,"d":"FC8qjdpMaRXxcckDKU7vT5uKAqeyxNnUkgan8TUwix0","crv":"P-256","x":"u_Nfbk_wYeaZNMYdeUrjNOv_EefXqh4AmwwUvkqfslA","y":"m7BIT4X0a0qzcrxsQrJMzM8JoaBxDfmwByOw1pMn_pI"}]'
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_EXTERNAL_APPLE_ENABLED: "false"
      GOTRUE_EXTERNAL_WEB3_ETHEREUM_ENABLED: "false"
      GOTRUE_EXTERNAL_WEB3_SOLANA_ENABLED: "false"
      GOTRUE_SECURITY_MANUAL_LINKING_ENABLED: "false"
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: "true"
      GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL: "10"
      GOTRUE_SECURITY_UPDATE_PASSWORD_REQUIRE_REAUTHENTICATION: "false"
      GOTRUE_SECURITY_CAPTCHA_ENABLED: "false"
      GOTRUE_PASSWORD_MIN_LENGTH: "6"
      GOTRUE_PASSWORD_REQUIRED_CHARACTERS: ""
      GOTRUE_RATE_LIMIT_EMAIL_SENT: "360000"
      GOTRUE_RATE_LIMIT_SMS_SENT: "30"
      GOTRUE_RATE_LIMIT_ANONYMOUS_USERS: "30"
      GOTRUE_RATE_LIMIT_TOKEN_REFRESH: "10000"
      GOTRUE_RATE_LIMIT_OTP: "10000"
      GOTRUE_RATE_LIMIT_VERIFY: "30"
      GOTRUE_RATE_LIMIT_WEB3: "30"
      GOTRUE_SMTP_HOST: mailpit
      GOTRUE_SMTP_PORT: "1025"
      GOTRUE_SMTP_ADMIN_EMAIL: admin@email.com
      GOTRUE_SMTP_SENDER_NAME: Admin
      GOTRUE_SMTP_MAX_FREQUENCY: 1s
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_MAILER_SECURE_EMAIL_CHANGE_ENABLED: "true"
      GOTRUE_MAILER_OTP_EXP: "3600"
      GOTRUE_MAILER_OTP_LENGTH: "6"
      GOTRUE_MAILER_URLPATHS_INVITE: http://127.0.0.1:55${SLOT}21/auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: http://127.0.0.1:55${SLOT}21/auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: http://127.0.0.1:55${SLOT}21/auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: http://127.0.0.1:55${SLOT}21/auth/v1/verify
      GOTRUE_MAILER_SUBJECTS_RECOVERY: Your Livami code / Твоят код за Livami
      GOTRUE_MAILER_TEMPLATES_RECOVERY: http://kong:8088/email/recovery.html
      GOTRUE_MAILER_TEMPLATE_RELOADING_ENABLED: "true"
      GOTRUE_SMS_AUTOCONFIRM: "true"
      GOTRUE_SMS_MAX_FREQUENCY: 5s
      GOTRUE_SMS_OTP_EXP: "6000"
      GOTRUE_SMS_OTP_LENGTH: "6"
      GOTRUE_SMS_TEMPLATE: "Your code is {{ .Code }}"
      GOTRUE_MFA_MAX_ENROLLED_FACTORS: "10"
      GOTRUE_MFA_TOTP_ENROLL_ENABLED: "false"
      GOTRUE_MFA_TOTP_VERIFY_ENABLED: "false"
      GOTRUE_MFA_PHONE_ENROLL_ENABLED: "false"
      GOTRUE_MFA_PHONE_VERIFY_ENABLED: "false"
      GOTRUE_MFA_WEB_AUTHN_ENROLL_ENABLED: "false"
      GOTRUE_MFA_WEB_AUTHN_VERIFY_ENABLED: "false"
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://127.0.0.1:9999/health
      interval: 1s
      timeout: 2s
      retries: 120

  rest:
    image: public.ecr.aws/supabase/postgrest:v16.4
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGRST_DB_URI: postgresql://authenticator:postgres@db:5432/postgres
      PGRST_DB_SCHEMAS: public,graphql_public
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_DB_MAX_ROWS: "1000"
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: *jwks
      PGRST_ADMIN_SERVER_PORT: "3001"
    # The postgrest image has no shell or HTTP client; up.sh checks it through Kong instead.

  realtime:
    image: public.ecr.aws/supabase/realtime:v2.143.4
    depends_on:
      db: { condition: service_healthy }
    # The tenant is named after the Host header; the CLI's Kong (and ours) call it realtime-dev.
    networks:
      default:
        aliases: [realtime-dev]
    environment:
      PORT: "4000"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: supabase_admin
      DB_PASSWORD: postgres
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: SET search_path TO _realtime
      DB_ENC_KEY: supabaserealtime
      API_JWT_SECRET: *jwt-secret
      API_JWT_JWKS: *jwks
      METRICS_JWT_SECRET: *jwt-secret
      SECRET_KEY_BASE: EAx3IQ/wRG1v47ZD4NE4/9RzBI8Jmil3x0yhcW4V2NHBP6c2iPIzwjofi2Ep4HIG
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
      MAX_HEADER_LENGTH: "4096"
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: ""
      SLOT_NAME_SUFFIX: ""
      ECTO_IPV6: "true"
    healthcheck:
      test: curl -sSfL --head -o /dev/null -H Host:realtime-dev http://127.0.0.1:4000/api/ping
      interval: 1s
      timeout: 2s
      retries: 120

  storage:
    image: public.ecr.aws/supabase/storage-api:v1.82.1
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://supabase_storage_admin:postgres@db:5432/postgres
      ANON_KEY: *anon-key
      SERVICE_KEY: *service-key
      AUTH_JWT_SECRET: *jwt-secret
      JWT_JWKS: *jwks
      TENANT_ID: stub
      GLOBAL_S3_BUCKET: stub
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /mnt
      STORAGE_S3_REGION: local
      FILE_SIZE_LIMIT: "52428800"
      UPLOAD_FILE_SIZE_LIMIT: "52428800000"
      UPLOAD_FILE_SIZE_LIMIT_STANDARD: "5242880000"
      SIGNED_UPLOAD_URL_EXPIRATION_TIME: "7200"
      TUS_URL_PATH: /storage/v1/upload/resumable
      S3_PROTOCOL_ENABLED: "true"
      S3_PROTOCOL_PREFIX: /storage/v1
      S3_PROTOCOL_ACCESS_KEY_ID: 625729a08b95bf1b7ff351a663f3a23c
      S3_PROTOCOL_ACCESS_KEY_SECRET: 850181e4652dd023b7a98c58ae0d2d34bd487ee0cc3254aed6eda37307425907
      ENABLE_IMAGE_TRANSFORMATION: "false"
      IMAGE_TRANSFORMATION_ENABLED: "false"
      VECTOR_ENABLED: "true"
      VECTOR_STORE_MIGRATIONS_ENABLED: "true"
      VECTOR_BUCKET_PROVIDER: pgvector
      VECTOR_DATABASE_URL: postgresql://postgres:postgres@db:5432/postgres
      DB_MIGRATIONS_FREEZE_AT: ""
    volumes:
      - storage-data:/mnt
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://127.0.0.1:5000/status
      interval: 1s
      timeout: 2s
      retries: 120

  mailpit:
    image: public.ecr.aws/supabase/mailpit:v1.31.3
    environment:
      MP_SMTP_DISABLE_RDNS: "true"
    ports:
      - 127.0.0.1:55${SLOT}24:8025
    healthcheck:
      test: /mailpit readyz
      interval: 1s
      timeout: 2s
      retries: 60

  kong:
    image: public.ecr.aws/supabase/kong:2.8.1
    depends_on: [auth, rest, realtime, storage]
    command: ["kong", "docker-start", "--nginx-conf", "/home/kong/teststack/nginx.template"]
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /home/kong/teststack/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_DNS_NOT_FOUND_TTL: "1"
      KONG_DNS_VALID_TTL: "5"
      KONG_PLUGINS: request-transformer,cors
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      KONG_NGINX_WORKER_PROCESSES: "1"
      KONG_PORT_MAPS: 55${SLOT}21:8000
    volumes:
      - ./kong:/home/kong/teststack:ro
      # The whole directory, never a single file: a single-file bind mount keeps the old inode when
      # git replaces the file, and GoTrue would go on sending the stale template.
      - ../../supabase/templates:/home/kong/templates/email:ro
    ports:
      - 127.0.0.1:55${SLOT}21:8000
    healthcheck:
      test: kong health
      interval: 1s
      timeout: 5s
      retries: 60

volumes:
  db-data:
  storage-data:
